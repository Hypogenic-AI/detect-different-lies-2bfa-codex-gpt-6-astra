[project]
name = "research-workspace"
version = "0.1.0"
description = "Research workspace for experiments"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.0.1",
    "matplotlib>=3.10.9",
    "pandas>=2.3.3",
    "pymupdf>=1.28.2",
    "pypdf>=6.19.0",
    "requests>=2.34.2",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
    "torch==2.6.0",
    "transformers>=4.51,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
